<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#1f2933;--muted:#5b6772;--line:#dde3e8;--brand:#1793e6;--bad:#d03b3b}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex;align-items:center;justify-content:center;padding:16px}
.box{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:16px;
  box-shadow:0 2px 12px rgba(16,32,64,.08);padding:26px 24px}
/* VisiLean and client logos (filled in by deploy.py; empty when there are none):
   a centred letterhead band across the top of the card, ruled off from the form.
   The client mark is drawn a little shorter so the two read the same size. */
.logos{display:flex;align-items:center;justify-content:center;gap:18px;margin:-26px -24px 22px;
  padding:22px 24px 20px;border-bottom:1px solid var(--line)}
.logos img{height:36px;width:auto;display:block}
.logos .cl{height:32px}
.logos .lsep{width:1px;height:30px;background:#c9d2da}
/* the password field, with a button to show what was typed */
.pwf{position:relative}
.pwf input{padding-right:44px}
.eye{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:34px;height:34px;padding:0;
  border:0;border-radius:8px;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer}
.eye:hover{background:var(--bg);color:var(--ink)}
.eye:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.eye svg{width:18px;height:18px}
.eyebrow{text-align:center;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--brand);font-weight:600}
h1{text-align:center;font-size:19px;margin:4px 0 20px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
input[type=password],input[type=text]{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;outline:none}
input[type=password]:focus,input[type=text]:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(23,147,230,.15)}
.rem{display:flex;align-items:center;gap:8px;margin:12px 0 16px;font-size:13px;color:var(--muted)}
button:not(.eye){width:100%;font:inherit;font-weight:600;padding:10px;border:0;border-radius:10px;background:var(--brand);color:#fff;cursor:pointer}
button:not(.eye)[disabled]{opacity:.6;cursor:progress}
.msg{margin-top:10px;font-size:13px;color:var(--bad);text-align:center}
.msg:empty{margin:0}
.note{font-size:12px;color:var(--muted);margin-top:16px;text-align:center}
</style>

        dt = tree(new Array(30).fill(5));
      } else {                                           // dynamic codes
        const hl = bits(5) + 257, hd = bits(5) + 1, hc = bits(4) + 4, cl = new Array(19).fill(0);
        const ORD = [16,17,18,0,8,7,9,6,10,5,11,4,12,3,13,2,14,1,15];
        for(let i = 0; i < hc; i++) cl[ORD[i]] = bits(3);
        const ct = tree(cl), lens = [];
        while(lens.length < hl + hd){
          const sy = decode(ct);
          if(sy < 16) lens.push(sy);
          else if(sy === 16){ const pv = lens[lens.length - 1]; for(let r = 3 + bits(2); r--;) lens.push(pv); }
          else for(let r = sy === 17 ? 3 + bits(3) : 11 + bits(7); r--;) lens.push(0);
        }
        lt = tree(lens.slice(0, hl)); dt = tree(lens.slice(hl));
      }
      for(;;){
        const sy = decode(lt);
        if(sy < 256){ room(1); out[op++] = sy; continue; }
        if(sy === 256) break;
        const n = LB[sy - 257] + bits(LX[sy - 257]), ds = decode(dt), d = DB[ds] + bits(DX[ds]);
        room(n); for(let k = 0; k < n; k++, op++) out[op] = out[op - d];
      }
    } while(!last);
    return out.subarray(0, op);
  }

  /* "Remember on this device" keeps the derived key, not the password: the key is
     stored non-extractable in IndexedDB, so reopening skips the slow derivation */
  const idb = () => new Promise((res, rej) => { const r = indexedDB.open('qt-keys', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('k'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const tx = (mode, fn) => idb().then(db => new Promise((res, rej) => {
    const q = fn(db.transaction('k', mode).objectStore('k')); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }));
  const keys = {
    get(){ return tx('readonly', s => s.get(KID)).catch(() => null); },
    set(k){ return tx('readwrite', s => s.put(k, KID)).then(() => true, () => false); },
    del(){ return tx('readwrite', s => s.delete(KID)).catch(() => null); }
  };
  // A password an older version of this page saved in localStorage: read once,
  // turned into a key, then deleted. Nothing writes one any more.
  const store = {
    get(){ try { return localStorage.getItem(KEY); } catch(e){ return null; } },
    del(){ try { localStorage.removeItem(KEY); } catch(e){} }
  };
  // Only the key is ever kept, and the browser will not hand it back. Without
  // IndexedDB (some private windows) nothing is remembered: the old fallback of
  // saving the password itself in localStorage left it readable on the device.
  async function remember(key){
    await keys.set(key); store.del();
  }

  if(!window.crypto || !crypto.subtle){
    $('msg').textContent = 'This browser cannot open protected pages. Use a current Safari, Chrome or Edge.';
    $('go').disabled = true;
    return;
  }
  // Show / hide what was typed.
  const EYE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
  const EYE_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.1M6.6 6.6C3.8 8.4 2 12 2 12s3.6 7 10 7a10.4 10.4 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';
  $('eye').innerHTML = EYE;
  $('eye').addEventListener('click', () => {
    const show = $('pw').type === 'password';
    $('pw').type = show ? 'text' : 'password';
    $('eye').innerHTML = show ? EYE_OFF : EYE;
    $('eye').setAttribute('aria-pressed', String(show));
    $('eye').setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    $('eye').title = $('eye').getAttribute('aria-label');
    $('pw').focus();
  });

  const busy = on => { $('go').disabled = on; $('go').textContent = on ? 'Opening…' : 'Open dashboard'; };

  // remembered on this device: open silently; a changed password clears it
  (async () => {
    const k = await keys.get(), pw = store.get();
    if(!k && !pw) return;
    busy(true);
    try {
      if(k) return show(await unlock(k));
      const key = await derive(pw), html = await unlock(key);
      await remember(key);                                // an old saved password becomes a key
      show(html);
    } catch(e){ keys.del(); store.del(); busy(false); }
  })();

  $('f').addEventListener('submit', async e => {
    e.preventDefault();
    const pw = $('pw').value;
    busy(true); $('msg').textContent = '';
    try {
      const key = await derive(pw), html = await unlock(key);
      if($('rem').checked) await remember(key); else { keys.del(); store.del(); }
      show(html);
    } catch(err){
      $('msg').textContent = 'That password is not right. Please try again.';
      busy(false);
      $('pw').select();
    }
  });
})();
</script>
</body>
</html>
